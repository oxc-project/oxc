name: Triage Model Test

on:
  push:
    branches: [feat/triage-action-models]
  workflow_dispatch:

permissions: {}

jobs:
  model:
    name: Kimi K3.1 Pro
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pinned action fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxc-project/triagebot-action
          ref: fee3b2cd2a38418a5c9560d08eb8fc34cec7f6b5
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.0

      - name: Install the action's locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate a fix, compile it, and verify the tool result
        id: smoke
        env:
          MODEL: cloudflare-ai/moonshotai/kimi-k3.1-pro
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:model

      - name: Summarize result
        if: always()
        env:
          MODEL: cloudflare-ai/moonshotai/kimi-k3.1-pro
          RESULT: ${{ steps.smoke.outcome }}
        run: |
          printf '| Model | Coding and tool-use smoke test |\n| --- | --- |\n| %s | %s |\n' "$MODEL" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
