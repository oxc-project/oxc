name: Triage Model Test

on:
  push:
    branches: [feat/triage-action-models]
  workflow_dispatch:

permissions: {}

jobs:
  model:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GLM-5.3
            model: cloudflare-ai/@cf/zai-org/glm-5.3
          - name: DeepSeek V4.1 Flash
            model: cloudflare-ai/@cf/deepseek-ai/deepseek-v4.1-flash-1017
          - name: Inkling 2 Small
            model: cloudflare-ai/@cf/thinkingmachines/inkling-2-small
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the pinned action fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxc-project/triagebot-action
          ref: d574ff99303b4db33a4ccc0c204aa63ce50154de
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.0

      - name: Install the action's locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify four Rust fixes with tool-result round trips
        id: smoke
        env:
          MODEL: ${{ matrix.model }}
          MODEL_EVAL: full
          MODEL_CONFIG: >-
            {"@cf/deepseek-ai/deepseek-v4.1-flash-1017":{"api":"openai-completions","contextWindow":1048576,"maxTokens":16384,"reasoning":true,"thinkingLevelMap":{"off":"none","minimal":"low","low":"low","medium":"high","high":"high","xhigh":"max"},"compat":{"supportsReasoningEffort":true,"maxTokensField":"max_tokens","requiresReasoningContentOnAssistantMessages":true}},"@cf/thinkingmachines/inkling-2-small":{"api":"openai-completions","contextWindow":1048576,"maxTokens":16384,"reasoning":true,"thinkingLevelMap":{"off":"none","xhigh":"max"},"compat":{"supportsReasoningEffort":true,"maxTokensField":"max_tokens","requiresReasoningContentOnAssistantMessages":true}}}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:model

      - name: Summarize result
        if: always()
        env:
          MODEL: ${{ matrix.model }}
          RESULT: ${{ steps.smoke.outcome }}
        run: |
          printf '| Model | Four-task Rust coding and tool-use evaluation |\n| --- | --- |\n| %s | %s |\n' "$MODEL" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
