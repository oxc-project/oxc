name: Benchmark

permissions: {}

on:
  workflow_dispatch:

concurrency:
  group: project-tokens-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  project-tokens:
    name: Whole-project token transfer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTUP_TOOLCHAIN: "1.99.1"
      RAYON_NUM_THREADS: "2"
      CARGO_PROFILE_RELEASE_STRIP: "none"
      CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          cache-key: benchmark-project-tokens
          save-cache: true
      - name: Get pinned bundler and real source projects
        run: |
          set -euo pipefail
          mkdir -p tmp
          git clone --depth 1 https://github.com/rolldown/rolldown.git tmp/rolldown
          git -C tmp/rolldown fetch --depth 1 origin 73a0b45bf8604a4cefaace350f269fed4ff1e677
          git -C tmp/rolldown checkout --detach FETCH_HEAD
          git clone --depth 1 https://github.com/rolldown/benchmarks.git tmp/project-inputs
          git -C tmp/project-inputs fetch --depth 1 origin f1e3c1355328a4081c097084f6b2b33ec4e4eb77
          git -C tmp/project-inputs checkout --detach FETCH_HEAD
          python3 tasks/benchmark/project-token-transfer/prepare.py "$PWD" "$PWD/tmp/rolldown"
      - name: Build parent and PR with the same dependencies
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 7c22786f9bb21cf18358b76ca6dc84f8a7d2b16f
          mkdir -p tmp/project-binaries
          export CARGO_TARGET_DIR="$PWD/target/rolldown-project"
          for variant in baseline candidate; do
            source_ref=HEAD
            if [ "$variant" = baseline ]; then source_ref=7c22786f9bb21cf18358b76ca6dc84f8a7d2b16f; fi
            git restore --source="$source_ref" crates/oxc_codegen/src/sourcemap_builder.rs
            (cd tmp/rolldown && cargo build --release -p bench --example project_build -j 2)
            cp "$CARGO_TARGET_DIR/release/examples/project_build" "tmp/project-binaries/$variant"
          done
          python3 tasks/benchmark/project-token-transfer/configure.py "$PWD" "$PWD/tmp/project-inputs" "$PWD/tmp/project-binaries"
      - name: Paired whole-build walltime
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: walltime
          config: tasks/benchmark/project-token-transfer/walltime.yml
      - name: Verify JS and serialized source maps
        run: |
          python3 tasks/benchmark/project-token-transfer/verify.py "$PWD" > tmp/project-output-checks.json
          cat tmp/project-output-checks.json
      - name: Whole-build memory
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: memory
          disable-memory-capture-stack: "true"
          config: tasks/benchmark/project-token-transfer/memory.yml
