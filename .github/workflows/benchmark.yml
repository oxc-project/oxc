# Benchmarks are sharded.
#
# Each benchmark (parser, transformer, etc) runs in parallel in a separate job.
#
# See https://docs.codspeed.io/features/sharded-benchmarks

name: Benchmark

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths: &paths
      - "crates/**/*.rs"
      - "tasks/benchmark/**/*.rs"
      - "tasks/common/**/*.rs"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  determine-matrix:
    name: Determine Benchmark
    runs-on: ubuntu-latest
    if: false # Temporary token-transfer benchmark, scoped below.
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Determine affected components
        id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MATRIX=$(node .github/scripts/generate-benchmark-matrix.js)
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  benchmark:
    needs: determine-matrix
    if: needs.determine-matrix.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication with CodSpeed
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}
    name: Bench ${{ matrix.component }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          cache-key: benchmark-${{ matrix.feature }}
          save-cache: ${{ github.ref_name == 'main' }}
          tools: cargo-codspeed

      # Memory mode reuses these binaries: cargo-codspeed maps both simulation and
      # memory modes to the same `analysis` build (`--cfg codspeed`) and directory.
      - name: Build benchmark
        env:
          RUSTFLAGS: "-C debuginfo=1 -C strip=none -g --cfg codspeed"
        run: |
          if [ "${{ matrix.component }}" = "linter" ]; then
            cargo build --release -p oxc_benchmark --bench linter \
              --no-default-features --features ${{ matrix.feature }} --features codspeed
          else
            cargo build --release -p oxc_benchmark \
              --bench ${{ matrix.component }} \
              --no-default-features --features ${{ matrix.feature }} --features codspeed
          fi
          mkdir -p target/codspeed/analysis/oxc_benchmark
          mv target/release/deps/${{ matrix.component }}-* target/codspeed/analysis/oxc_benchmark
          rm target/codspeed/analysis/oxc_benchmark/*.d

      - name: Run benchmark
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        timeout-minutes: 30
        with:
          mode: ${{ matrix.mode }}
          run: cargo codspeed run ${{ matrix.component }}

  token-transfer:
    name: Token transfer (${{ matrix.profile }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        profile: [walltime, analysis]
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          cache-key: benchmark-compiler
          tools: cargo-codspeed@4.7.0
      - name: Build both versions with both allocators
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          TOKEN_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 7c22786f9bb21cf18358b76ca6dc84f8a7d2b16f
          measurement=walltime
          if [ "$TOKEN_PROFILE" = "analysis" ]; then measurement=simulation; fi
          for allocator in never_grow system; do
            features=compiler
            if [ "$allocator" = "system" ]; then features=compiler,system_allocator; fi
            for variant in baseline candidate; do
              source_ref=HEAD
              if [ "$variant" = "baseline" ]; then source_ref=7c22786f9bb21cf18358b76ca6dc84f8a7d2b16f; fi
              git restore --source="$source_ref" crates/oxc_codegen/src/sourcemap_builder.rs
              cargo codspeed build -m "$measurement" -p oxc_benchmark --bench token_transfer --no-default-features --features "$features" --locked
              cp "target/codspeed/$TOKEN_PROFILE/oxc_benchmark/token_transfer" "/tmp/tokens-$allocator-$variant"
            done
          done
      - name: Paired walltime
        if: matrix.profile == 'walltime'
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: walltime
          run: |
            set -euo pipefail
            for allocator in never_grow system; do
              for variant in baseline_1 candidate_1 candidate_2 baseline_2; do
                cp "/tmp/tokens-$allocator-${variant%_*}" target/codspeed/walltime/oxc_benchmark/token_transfer
                TOKEN_VARIANT="$variant" cargo codspeed run -p oxc_benchmark --bench token_transfer -- --warm-up-time 0.5 --measurement-time 1 --sample-size 30 | tee "/tmp/tokens-$allocator-$variant.log"
              done
              sed -n '/^CHECK /p' "/tmp/tokens-$allocator-baseline_1.log" > /tmp/tokens-baseline-checks
              sed -n '/^CHECK /p' "/tmp/tokens-$allocator-candidate_1.log" > /tmp/tokens-candidate-checks
              diff -u /tmp/tokens-baseline-checks /tmp/tokens-candidate-checks
            done
      - name: Simulation and memory
        if: matrix.profile == 'analysis'
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: simulation,memory
          run: |
            set -euo pipefail
            for allocator in never_grow system; do
              for variant in baseline candidate; do
                cp "/tmp/tokens-$allocator-$variant" target/codspeed/analysis/oxc_benchmark/token_transfer
                TOKEN_VARIANT="$variant" cargo codspeed run -p oxc_benchmark --bench token_transfer | tee "/tmp/tokens-$allocator-$variant.log"
              done
              sed -n '/^CHECK /p' "/tmp/tokens-$allocator-baseline.log" > /tmp/tokens-baseline-checks
              sed -n '/^CHECK /p' "/tmp/tokens-$allocator-candidate.log" > /tmp/tokens-candidate-checks
              diff -u /tmp/tokens-baseline-checks /tmp/tokens-candidate-checks
            done
