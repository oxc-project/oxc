name: Benchmark
permissions: {}
on:
  workflow_dispatch:
concurrency:
  group: comment-swar-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  comments:
    name: Comment scanning (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, walltime]
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12
        with:
          cache-key: benchmark-compiler
          tools: cargo-codspeed@4.7.0
      - name: Build baseline and two independent comment variants
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 6611cf9826e5162dbae49c4fb1e7a2a415a182ab c0125dae5f612503c186f79fa97261e9ac93dd19 a44558ff1a573480d316da21f9be90ce021d9c26
          output=analysis
          if [ "$MODE" = walltime ]; then output=walltime; fi
          for variant in baseline line block; do
            source_ref=a44558ff1a573480d316da21f9be90ce021d9c26
            if [ "$variant" = baseline ]; then source_ref=6611cf9826e5162dbae49c4fb1e7a2a415a182ab; fi
            if [ "$variant" = line ]; then source_ref=c0125dae5f612503c186f79fa97261e9ac93dd19; fi
            git restore --source="$source_ref" crates/oxc_parser/src/lexer/comment.rs
            cargo codspeed build -m "$MODE" -p oxc_benchmark --bench comment_swar --no-default-features --features compiler --locked
            cp "target/codspeed/$output/oxc_benchmark/comment_swar" "/tmp/comments-$variant"
          done
      - name: Same-runner walltime
        if: matrix.mode == 'walltime'
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: walltime
          run: |
            set -euo pipefail
            for variant in baseline_1 line_1 block_1 block_2 line_2 baseline_2; do
              cp "/tmp/comments-${variant%_*}" target/codspeed/walltime/oxc_benchmark/comment_swar
              COMMENT_VARIANT="$variant" cargo codspeed run -p oxc_benchmark --bench comment_swar -- --warm-up-time 0.5 --measurement-time 1 --sample-size 30 | tee "/tmp/comments-$variant.log"
            done
            for variant in line block; do
              diff -u <(sed -n '/^CHECK /p' /tmp/comments-baseline_1.log) <(sed -n '/^CHECK /p' "/tmp/comments-${variant}_1.log")
            done
      - name: CPU simulation
        if: matrix.mode == 'simulation'
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5
        with:
          mode: simulation
          run: |
            set -euo pipefail
            for variant in baseline line block; do
              cp "/tmp/comments-$variant" target/codspeed/analysis/oxc_benchmark/comment_swar
              COMMENT_VARIANT="$variant" cargo codspeed run -p oxc_benchmark --bench comment_swar | tee "/tmp/comments-$variant.log"
            done
            for variant in line block; do
              diff -u <(sed -n '/^CHECK /p' /tmp/comments-baseline.log) <(sed -n '/^CHECK /p' "/tmp/comments-$variant.log")
            done
