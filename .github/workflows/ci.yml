name: CI

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  INSTA_REQUIRE_FULL_MATCH: 1
  # Workflow-level, so every job's `Swatinem/rust-cache` key hashes the same `CARGO_*` env vars.
  CARGO_BUILD_WARNINGS: deny

jobs:
  test-ubuntu:
    name: Test Linux
    runs-on: namespace-profile-linux-x64-default
    env:
      # Fail if the CPU doesn't support AVX2, so AVX2 can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Avx2
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - run: cargo ck
      - run: cargo test --all-features
      - run: git diff --exit-code # Must commit everything

  test-ubuntu-aarch64:
    if: ${{ github.ref_name == 'main' }}
    name: Test Linux ARM64
    runs-on: ubuntu-24.04-arm
    env:
      # Fail if the CPU doesn't support Neon, so Neon can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Neon
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
            with:
              save-cache: ${{ github.ref_name == 'main' }}
              cache-key: warm-aarch64
      - run: cargo ck
      - run: cargo test --all-features
      - run: git diff --exit-code # Must commit everything

  test-mac: # Separate job to save a job on PRs
    if: ${{ github.ref_name == 'main' }}
    name: Test Mac
    runs-on: namespace-profile-mac-default
    env:
      # Fail if the CPU doesn't support Neon, so Neon can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Neon
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # `cache: pnpm` is intentionally omitted. On Mac OS, `cache: pnpm` replaces the pnpm store directory
      # (`~/setup-pnpm/node_modules/.bin/store/v11`) with a symlink into the Namespace cache volume.
      # But `oxc-project/setup-node` also caches that same path via `actions/cache`, and at job end
      # `tar` archives the symlink record itself rather than the store contents - producing a faulty cache.
      # `actions/cache` already handles pnpm correctly here, only `rust` needs the NS volume.
      # Note: On Linux this action uses bind-mounts, which don't have this problem - it's a Mac OS problem only.
      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
            with:
              cache: rust
      - run: cargo ck
      - run: cargo test --all-features
      - run: git diff --exit-code # Must commit everything

  test-windows:
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
    name: Test Windows
    runs-on: windows-latest
    env:
      # Fail if the CPU doesn't support Neon, so Neon can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Avx2
    steps:
      - run: git config --system core.longpaths true
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # Unsung heroes of the internet, who led me here to speed up Windows' slowness:
      # https://github.com/actions/cache/issues/752#issuecomment-1847036770
      # https://github.com/astral-sh/uv/blob/502e04200d52de30d3159894833b3db4f0d6644d/.github/workflows/ci.yml#L158
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          workspace-copy: true
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      # Copy before installing: the Dev Drive action does not preserve pnpm 12 directory symlinks.
      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - name: Install Rust
            working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
            shell: bash
            run: |
              # This `awk` command will find the value of our Minimum Supported Rust Version and store it as `MSRV`.
              # NOTE: this will fail if there are any other items named `rust-version`. We assume there is only one in our `Cargo.toml`.
              MSRV=$(awk -F'=' '/rust-version/ {gsub(/[" ]/, "", $2); printf "%s", ($2 + "")}' Cargo.toml)
              # Set profile to minimal and channel to our Minimum Supported Rust Version.
              # Running our tests on this channel ensures that our code uses APIs that are supported in our `MSRV`.
              sed -i -e 's/profile = "default"/profile = "minimal"/g' -e "s/channel = .*/channel = \"$MSRV\"/g" rust-toolchain.toml
              rustup set profile minimal
              rustup show
              git restore .

      - name: Install dependencies on Dev Drive
        id: dependencies
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: pnpm install --frozen-lockfile --ignore-scripts
        background: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          save-if: ${{ github.ref_name == 'main' }}
          shared-key: windows-latest

      - name: Compile tests
        run: cargo test --all-features --no-run
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        shell: bash

      - wait: dependencies

      - name: Run tests
        # No need for `cargo ck` because it's already checked in linux
        # Run `website` tests separately to avoid feature unification problems with `oxlint`
        run: cargo test --all-features
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        shell: bash

  test-big-endian:
    if: ${{ github.ref_name == 'main' }}
    name: Test big-endian # s390x-unknown-linux-gnu is a big-endian
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /home/runner/.rustup
          cache: rust
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross
      # `--lib --bins --tests` to skip doctests which are very slow to run via `cross`.
      # https://github.com/cross-rs/cross/issues/1703
      - run: cross test --lib --bins --tests --all-features --target s390x-unknown-linux-gnu

  test-32bit:
    if: ${{ github.ref_name == 'main' }}
    name: Test 32-bit # armv7-unknown-linux-gnueabihf is a 32-bit target
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /home/runner/.rustup
          cache: rust
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cross
      # `--lib --bins --tests` to skip doctests which are very slow to run via `cross`.
      # https://github.com/cross-rs/cross/issues/1703
      - run: cross test --workspace --lib --bins --tests --all-features --exclude oxc_language_server --exclude oxc_linter --exclude oxlint --target armv7-unknown-linux-gnueabihf

  test-wasm32-wasip1-threads:
    name: Test wasm32-wasip1-threads
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          exclude: oxc_linter
          paths: napi/,npm/,apps/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - name: Install Playwright Chromium
        id: playwright
        if: steps.filter.outputs.changed == 'true'
        working-directory: napi/parser
        run: pnpm exec playwright install chromium
        background: true
      - name: Build
        if: steps.filter.outputs.changed == 'true'
        run: |
          rustup target add wasm32-wasip1
          rustup target add wasm32-wasip1-threads
          pnpm run build-wasm-dev
          pnpm run build-wasip1-dev
          git diff --exit-code # Must commit everything
      - wait: playwright
      - name: Test wasi in browser
        if: steps.filter.outputs.changed == 'true'
        working-directory: napi/parser
        run: |
          rm -rf *.wasm
          pnpm run build-wasi
          pnpm run build-wasm-dev
          pnpm run build-wasip1-dev
          pnpm run build-npm-dir
          pnpm run test-browser
          pnpm build-browser-bundle --npmDir npm-dir

  test-napi-compiler:
    name: Test NAPI Compiler
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          exclude: oxc_linter,oxc_language_server
          paths: napi/parser/,napi/minify/,napi/transform/,napi/transform-react/,napi/transform-relay/,npm/oxc-types/,npm/runtime/,tasks/e2e/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: $/.github/actions/clone-submodules
        id: napi-fixtures
        if: steps.filter.outputs.changed == 'true'
        with:
          babel: false
          node-compat-table: false
        background: true
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - if: steps.filter.outputs.changed == 'true'
        name: Build packages
        run: pnpm --workspace-concurrency=1 --filter "./napi/parser" --filter "./napi/minify" --filter "./napi/transform" --filter "./napi/transform-react" --filter "./napi/transform-relay" build-test
      - if: steps.filter.outputs.changed == 'true'
        name: Run runtime helper tests
        working-directory: npm/runtime
        run: node --run test
      # Building and the runtime helpers do not read the fixtures, so the clone
      # overlaps them; only the tests below need it.
      - wait: napi-fixtures
      - parallel:
          - if: steps.filter.outputs.changed == 'true'
            name: Run tests
            env:
              RUN_RAW_RANGE_TESTS: "true"
              RUN_RAW_TOKENS_TESTS: "true"
            run: pnpm --workspace-concurrency=1 --filter "./napi/parser" --filter "./napi/minify" --filter "./napi/transform" --filter "./napi/transform-react" --filter "./napi/transform-relay" test
          - if: steps.filter.outputs.changed == 'true'
            name: Run e2e tests
            working-directory: tasks/e2e
            run: pnpm run test
      - if: steps.filter.outputs.changed == 'true'
        run: |
          git diff --exit-code # Must commit everything

  test-react-compiler:
    name: Test React Compiler Runtime
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          packages: oxc_sprout
          paths: tasks/sprout/,crates/oxc_react_compiler/fixtures/,crates/oxc_react_compiler/tests/,pnpm-workspace.yaml,pnpm-lock.yaml,justfile
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - name: Check Sprout
        if: steps.filter.outputs.changed == 'true'
        run: |
          pnpm --dir tasks/sprout test-harness
          pnpm --dir tasks/sprout test
          git diff --exit-code

  test-napi-shared:
    name: Test NAPI Shared
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          paths: apps/shared/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            pnpm
      - if: steps.filter.outputs.changed == 'true'
        name: Run tests
        run: pnpm --filter "@oxapps/shared" test

  test-napi-oxlint:
    name: Test NAPI Oxlint
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          paths: apps/oxlint/,apps/shared/,npm/oxlint/,npm/oxlint-plugin-eslint/,npm/oxlint-plugins/,npm/oxc-types/,crates/oxc_config/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - if: steps.filter.outputs.changed == 'true'
        name: Run tests
        run: |
          pnpm --filter "./apps/oxlint" build-test
          pnpm --filter "./apps/oxlint" test
      - if: steps.filter.outputs.changed == 'true'
        run: |
          git diff --exit-code # Must commit everything

  test-napi-oxfmt:
    name: Test NAPI Oxfmt
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          paths: apps/oxfmt/,apps/shared/,npm/oxfmt/,crates/oxc_formatter/,crates/oxc_formatter_core/,crates/oxc_formatter_css/,crates/oxc_formatter_graphql/,crates/oxc_formatter_json/,crates/oxc_formatter_yaml/,crates/oxc_formatter_markdown/,crates/oxc_formatter_htmlish/,crates/oxc_formatter_toml/,crates/oxc_config/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: $/.github/actions/check-changes
        id: filter-conformance
        with:
          # Every crate oxfmt formats with (parsers, AST, ...), not only the formatters
          packages: oxfmt
          paths: apps/oxfmt/,npm/oxfmt/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true' || steps.filter-conformance.outputs.changed == 'true'
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true' || steps.filter-conformance.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      # Conformance ---
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        id: conformance-externals
        if: steps.filter-conformance.outputs.changed == 'true'
        with:
          # Warm externals skip download entirely (`.version` stamps in download-externals.ts)
          path: ./apps/oxfmt/conformance/externals
        background: true
      - if: steps.filter.outputs.changed == 'true' || steps.filter-conformance.outputs.changed == 'true'
        name: Build tests
        run: pnpm --filter "./apps/oxfmt" build-test
      - wait: conformance-externals
      - if: steps.filter-conformance.outputs.changed == 'true'
        name: Download conformance externals
        run: pnpm --filter "./apps/oxfmt" download-externals
      - parallel:
          - if: steps.filter.outputs.changed == 'true'
            name: Run tests
            run: pnpm --filter "./apps/oxfmt" test
          - if: steps.filter-conformance.outputs.changed == 'true'
            name: Run conformance tests
            run: pnpm --filter "./apps/oxfmt" conformance
      # --- Conformance
      - if: steps.filter.outputs.changed == 'true' || steps.filter-conformance.outputs.changed == 'true'
        run: |
          git diff --exit-code # Must commit everything

  test-napi-compiler-windows:
    name: Test NAPI Compiler (windows)
    runs-on: windows-latest
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
    # Keep steps sequential to avoid event.json locking: https://github.com/actions/runner/issues/4641
    steps:
      - run: git config --system core.longpaths true
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          exclude: oxc_linter,oxc_language_server
          paths: napi/parser/,napi/minify/,napi/transform/,napi/transform-react/,napi/transform-relay/,npm/oxc-types/,npm/runtime/,tasks/e2e/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: steps.filter.outputs.changed == 'true'
        with:
          workspace-copy: true
          drive-size: 12GB
          drive-format: ReFS
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
      # Copy before installing: the Dev Drive action does not preserve pnpm 12 directory symlinks.
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'
      - uses: oxc-project/setup-rust@12a52e3caf7bac9d8b9ca550a82c425ed6343aee # v1.0.18
        if: steps.filter.outputs.changed == 'true'
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          cache-key: napi-compiler-windows
          save-cache: ${{ github.ref_name == 'main' }}
      - uses: $/.github/actions/clone-submodules
        if: steps.filter.outputs.changed == 'true'
        with:
          babel: false
          node-compat-table: false
      - name: Install dependencies on Dev Drive
        if: steps.filter.outputs.changed == 'true'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.filter.outputs.changed == 'true'
        name: Build packages
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        shell: bash
        run: |
          cargo build --profile coverage \
            -p oxc_parser_napi \
            -p oxc_minify_napi \
            -p oxc_transform_napi \
            -p oxc_transform_react_napi \
            -p oxc_transform_relay_napi \
            --features oxc_parser_napi/tokens

          artifacts=(
            "oxc_parser_napi.dll:napi/parser/src-js/parser.win32-x64-msvc.node"
            "oxc_minify_napi.dll:napi/minify/minify.win32-x64-msvc.node"
            "oxc_transform_napi.dll:napi/transform/transform.win32-x64-msvc.node"
            "oxc_transform_react_napi.dll:napi/transform-react/transform-react.win32-x64-msvc.node"
            "oxc_transform_relay_napi.dll:napi/transform-relay/transform-relay.win32-x64-msvc.node"
          )
          for artifact in "${artifacts[@]}"; do
            IFS=: read -r source destination <<< "$artifact"
            source="target/coverage/$source"
            test -f "$source"
            cp "$source" "$destination"
          done
      - if: steps.filter.outputs.changed == 'true'
        name: Run tests
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        env:
          RUN_RAW_RANGE_TESTS: "true"
        run: pnpm --workspace-concurrency=1 --filter "./napi/parser" --filter "./napi/minify" --filter "./napi/transform" --filter "./napi/transform-react" --filter "./napi/transform-relay" test
      - if: steps.filter.outputs.changed == 'true'
        name: Run e2e tests
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}/tasks/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
      - if: steps.filter.outputs.changed == 'true'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: |
          git diff --exit-code # Must commit everything

  test-napi-oxlint-windows:
    name: Test NAPI Oxlint (windows)
    runs-on: windows-latest
    if: ${{ github.ref_name == 'main' }}
    steps:
      - run: git config --system core.longpaths true
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          paths: apps/oxlint/,apps/shared/,npm/oxlint/,npm/oxlint-plugin-eslint/,npm/oxlint-plugins/,npm/oxc-types/,crates/oxc_config/,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
