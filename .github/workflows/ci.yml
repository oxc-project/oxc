  lint:
    name: Lint
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm
      - name: JavaScript lint
        id: javascript-lint
        run: |
          pnpm --filter oxlint-app build-js
          pnpm --filter oxfmt-app build-js
          pnpm --filter oxc-codegen build
          node --run lint
        background: true
      - run: rustup component add clippy
      - run: cargo lint
      # Catch lints which only fire with `debug_assertions` off (i.e. release mode),
      # e.g. code becoming unused when a `#[cfg(debug_assertions)]` block vanishes.
      # Main-only and without `--all-targets`: these failures are rare and a post-merge
      # failure pinpoints the culprit commit, so not worth doubling clippy time on every PR.
      # `--all-targets` is omitted because test/bench code is never built in release mode
      # with warnings denied.
      - if: ${{ github.ref_name == 'main' }}
        run: cargo clippy --all-features --profile dev-no-debug-assertions
      - wait: javascript-lint

  doc:
    name: Doc
    runs-on: namespace-profile-linux-x64-default
    env:
      TOOLCHAIN: nightly-2026-09-30
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: /home/runner/.rustup
          cache: rust
      - run: rustup toolchain install "${TOOLCHAIN}" --profile minimal --component rust-docs
      # https://github.com/rust-lang/rust/issues/146895
      - run: RUSTDOCFLAGS='-D warnings' cargo +"${TOOLCHAIN}" doc --no-deps --document-private-items --all-features -Zrustdoc-mergeable-info

  conformance:
    name: Conformance
    runs-on: namespace-profile-linux-x64-default
    env:
      # Fail if the CPU doesn't support AVX2, so AVX2 can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Avx2
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Check if conformance should run
        id: filter
        uses: $/.github/actions/check-changes
        with:
          packages: oxc_coverage,oxc_transform_conformance
          paths: tasks/coverage/,tasks/common/,tasks/transform_conformance/,pnpm-lock.yaml
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: $/.github/actions/clone-submodules
        id: conformance-fixtures
        if: steps.filter.outputs.changed == 'true'
        with:
          node-compat-table: false
        background: true

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: steps.filter.outputs.changed == 'true'
        with:
          tool: just

      - wait: conformance-fixtures

      - name: Check Conformance
        if: steps.filter.outputs.changed == 'true'
        run: |
          just update-transformer-fixtures
          just coverage
          git diff --exit-code

  lexer-arm64:
    # `oxc_lexer` has 3 implementations:
    # 1. AVX2 on x86_64 with `avx2` + `bmi2` + `popcnt`.
    # 2. Neon on aarch64.
    # 3. Generic everywhere else.
    #
    # On x86_64, a build contains both AVX2 and generic, and picks one at runtime, depending on
    # what the CPU supports. The lexer's tests, and lexer conformance, run with each implementation
    # the CPU supports. So the "Test Linux" and "Conformance" jobs cover AVX2 and generic.
    # Lexer conformance fails if their outputs differ.
    #
    # "Test Linux ARM64" covers Neon, but only runs on `main`. This job runs `oxc_lexer`'s and
    # `oxc_simd`'s tests, and lexer conformance, on aarch64 for PRs which change the lexer,
    # so a PR which breaks Neon fails before it's merged. Lexer conformance on Neon only runs here.
    #
    # Only Neon runs on aarch64, so conformance can't compare Neon's output with AVX2's and
    # generic's, as it compares those 2 on x86_64. It compares Neon's token spans, comments and
    # first error with the parser's, and fails if that changes the committed snapshots.
    # The rest of Neon's output (e.g. token kinds and values) is only checked by the tests.
    #
    # `CARGO_BUILD_WARNINGS: deny` makes the tests fail on any compiler warning,
    # so warnings in code which is only compiled on aarch64 are caught too.
    name: Lexer ARM64
    runs-on: ubuntu-24.04-arm
    if: ${{ github.ref_name != 'main' }}
    env:
      # Fail if the CPU doesn't support Neon, so Neon can't quietly go untested.
      # See `DynCpu::for_each_supported` in `oxc_simd` crate.
      OXC_SIMD_EXPECT: Neon
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Check if lexer checks should run
        id: filter
        uses: $/.github/actions/check-changes
        with:
          packages: oxc_lexer,oxc_simd,oxc_simd_macros,oxc_coverage
          paths: crates/oxc_lexer/,crates/oxc_simd/,crates/oxc_simd_macros/,tasks/coverage/,.github/workflows/ci.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: $/.github/actions/clone-submodules
        id: lexer-fixtures
        if: steps.filter.outputs.changed == 'true'
        with:
          node-compat-table: false
        background: true

      # Restore the cache which "Test Linux ARM64" saves on `main`. It builds these crates too.
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        if: steps.filter.outputs.changed == 'true'
        with:
          save-cache: false
          cache-key: warm-aarch64

      - name: Test
        if: steps.filter.outputs.changed == 'true'
        run: cargo test --all-features -p oxc_lexer -p oxc_simd

      - wait: lexer-fixtures

      - name: Conformance
        if: steps.filter.outputs.changed == 'true'
        run: |
          cargo coverage lexer
          git diff --exit-code

  test-codegen:
    name: Test Codegen
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Check if codegen tests should run
        id: filter
        uses: $/.github/actions/check-changes
        with:
          packages: oxc_codegen_conformance,oxc_parser_napi
          paths: .github/workflows/ci.yml,packages/codegen/,tasks/codegen_conformance/,napi/parser/,npm/oxc-types/,tasks/coverage/,pnpm-lock.yaml,pnpm-workspace.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: $/.github/actions/clone-submodules
        id: codegen-fixtures
        if: steps.filter.outputs.changed == 'true'
        with:
          node-compat-table: false
        background: true

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm

      - wait: codegen-fixtures

      - name: Run codegen tests
        if: steps.filter.outputs.changed == 'true'
        run: |
          pnpm --filter oxc-codegen build-test
          pnpm --filter oxc-codegen test
          git diff --exit-code

  minification:
    name: Minification Size
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: $/.github/actions/check-changes
        id: filter
        with:
          packages: oxc_minsize
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: rust

      - name: Check minification size
        if: steps.filter.outputs.changed == 'true'
        run: |
          cargo minsize
          git diff --exit-code

      # Write a human-readable diff of the minified output vs the base branch
      # to the job summary for review (same flow as `just minifier-diff`).
      - name: Diff minify output
        if: ${{ !cancelled() && steps.filter.outputs.changed == 'true' && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          cargo minsize --compress-only pr
          if fetch_output=$(git fetch --depth 1 origin "$BASE_REF" 2>&1); then
            printf '%s\n' "$fetch_output" >&2
          else
            fetch_status=$?
            printf '%s\n' "$fetch_output" >&2
            if [[ "$BASE_REF" == graphite-base/* ]] &&
              grep -Fxq "fatal: couldn't find remote ref $BASE_REF" <<< "$fetch_output"; then
              printf 'Skipped minify output diff: base ref `%s` is no longer available on origin.\n' "$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$fetch_status"
          fi
          git checkout -f FETCH_HEAD
          cargo minsize --compress-only main

          echo '# Minify Output Diff' >> "$GITHUB_STEP_SUMMARY"
          changed=false
          for pr_file in target/minifier/pr/*.js; do
            name=$(basename "$pr_file")
            if ! diff -uN "target/minifier/main/$name" "$pr_file" > /tmp/minify.diff; then
              changed=true
              {
                echo "## $name"
                echo '```diff'
                head -n 200 /tmp/minify.diff
                if [ "$(wc -l < /tmp/minify.diff)" -gt 200 ]; then echo '... (truncated)'; fi
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$changed" = false ]; then
            echo 'No difference in compress-only output compared to the base branch.' >> "$GITHUB_STEP_SUMMARY"
          fi

  allocs:
    name: Allocations
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          packages: oxc_track_memory_allocations
          paths: tasks/track_memory_allocations/
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: rust

      - name: Check allocations
        if: steps.filter.outputs.changed == 'true'
        run: |
          cargo allocs
          git diff --exit-code ||
          (echo 'Allocations have changed. Run the `cargo allocs` command to update the allocation snapshot, otherwise please fix the regression.' && exit 1)

  ast_changes:
    name: AST Changes
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: ".github/generated/ast_changes_watch_list.yml"

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.src == 'true'

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.src == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm

      - run: rustup component add rustfmt
        if: steps.filter.outputs.src == 'true'

      - name: Check AST Changes
        if: steps.filter.outputs.src == 'true'
        run: |
          cargo run -p oxc_ast_tools
          git diff --exit-code ||
          (echo 'AST changes caused the "generated" code to get outdated. Have you forgotten to run the `just ast` command and/or commit generated codes?' && exit 1)

  lintgen:
    name: Linter changes
    runs-on: namespace-profile-linux-x64-default
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-changes
        id: filter
        with:
          packages: oxc_linter,oxc_track_linter_timings
          paths: tasks/linter_codegen/,tasks/track_linter_timings/,npm/oxlint/configuration_schema.json,apps/oxlint/src-js/package/config.generated.ts,apps/oxlint/scripts/generate-config-types.ts,apps/oxlint/package.json,pnpm-lock.yaml,package.json
          token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
        if: steps.filter.outputs.changed == 'true'

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: steps.filter.outputs.changed == 'true'
        with:
          path: /home/runner/.rustup
          cache: |
            rust
            pnpm

      - run: rustup component add rustfmt
        if: steps.filter.outputs.changed == 'true'

      - name: Check linter changes
        if: steps.filter.outputs.changed == 'true'
        run: |
          cargo lintgen
          pnpm --filter oxlint-app generate-config-types
          cargo lint-timings
          git diff --exit-code ||
          (echo 'Linter generated files or timing snapshots have changed. Run `cargo lintgen`, `just linter-schema-json`, `just linter-config-ts`, and `cargo lint-timings`, then commit the generated files.' && exit 1)
