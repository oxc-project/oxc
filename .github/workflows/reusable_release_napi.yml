name: Release NAPI

permissions: {}

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        type: choice
        description: "Build and package without publishing"
        options: [parser, transform, minify]
      dry-run:
        type: boolean
        default: true
        description: "Manual runs never publish"
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: "The component name"
      dry-run:
        type: boolean
        default: false
        description: "Build and package without publishing"

jobs:
  check:
    name: Check version
    runs-on: ubuntu-slim
    outputs:
      version_changed: ${{ (github.event_name == 'workflow_dispatch' || inputs.dry-run) && 'true' || steps.check.outputs.version_changed }}
    env:
      name: ${{ inputs.name }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: $/.github/actions/check-version
        id: check
        if: github.event_name != 'workflow_dispatch' && !inputs.dry-run
        with:
          file-name: napi/${{ inputs.name }}/package.json
          file-url: https://unpkg.com/oxc-${{ inputs.name }}@latest/package.json

  prepare-pgo:
    needs: check
    if: needs.check.outputs.version_changed == 'true' && contains(fromJSON('["parser", "transform", "minify"]'), inputs.name)
    name: Prepare PGO corpus
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - uses: $/.github/actions/clone-submodules
            with:
              node-compat-table: false
      - name: Prepare full ecosystem and conformance corpus
        run: |
          node tasks/transform_conformance/update_fixtures.ts
          pnpm node tasks/pgo/pgo.mjs prepare --fetch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgo-corpus
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # Shards are already compressed.
          path: target/pgo/corpus

  build:
    needs: [check, prepare-pgo]
    if: >-
      !cancelled() && needs.check.outputs.version_changed == 'true' &&
      (needs.prepare-pgo.result == 'success' || needs.prepare-pgo.result == 'skipped')
    name: Build ${{ matrix.target }}
    runs-on: ${{ contains(fromJSON('["parser", "transform", "minify"]'), inputs.name) && matrix.pgo-os || matrix.os }}
    env:
      name: ${{ inputs.name }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pgo: true
            build: pnpm build --target x86_64-pc-windows-msvc

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pgo: true
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build --target x86_64-unknown-linux-musl -x

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pgo: true
            pgo-os: ubuntu-24.04-arm
            build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build --target aarch64-unknown-linux-musl -x

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: pnpm build --target armv7-unknown-linux-gnueabihf --use-napi-cross

          - os: macos-latest
            target: x86_64-apple-darwin
            pgo: true
            pgo-os: macos-15-intel
            build: pnpm build --target x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            pgo: true
            build: pnpm build --target aarch64-apple-darwin

          - os: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build-wasm

          - os: ubuntu-latest
            target: wasm32-wasip1
            build: pnpm build-wasip1

          - os: ubuntu-latest
            target: s390x-unknown-linux-gnu
            build: |
              export CFLAGS="-fuse-ld=lld"
              pnpm build --target s390x-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: aarch64-linux-android
            build: pnpm build --target aarch64-linux-android

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install gcc-riscv64-linux-gnu g++-riscv64-linux-gnu -y
              export TARGET_CC=riscv64-linux-gnu-gcc
              export CXX=riscv64-linux-gnu-g++
              pnpm build --target riscv64gc-unknown-linux-gnu

          - os: ubuntu-latest
            target: aarch64-unknown-linux-ohos
            build: pnpm build --target aarch64-unknown-linux-ohos

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            build: pnpm build --target armv7-linux-androideabi

          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            build: pnpm build --target armv7-unknown-linux-musleabihf -x

          - os: windows-latest
            target: i686-pc-windows-msvc
            build: pnpm build --target i686-pc-windows-msvc

          - os: ubuntu-latest
            target: powerpc64le-unknown-linux-gnu
            build: pnpm build --target powerpc64le-unknown-linux-gnu --use-napi-cross

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            build: |
              sudo apt-get update
              sudo apt-get install gcc-riscv64-linux-gnu g++-riscv64-linux-gnu -y
              export TARGET_CC=riscv64-linux-gnu-gcc
              export CXX=riscv64-linux-gnu-g++
              pnpm build --target riscv64gc-unknown-linux-musl -x

    steps:
      - if: ${{ contains(matrix.os, 'windows') }}
        run: git config --system core.longpaths true

      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - run: rustup target add ${{ matrix.target }}
          - name: Setup OpenHarmony SDK
            if: ${{ contains(matrix.target, 'ohos') }}
            uses: Boshen/setup-ohos-sdk@edb865a89a712f1f15dbad932dfa9cfce849d95c # v1.0.0
          - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
            if: ${{ contains(matrix.target, 'musl') }}
            with:
              version: 0.13.0

      - name: Download PGO corpus
        if: matrix.pgo && contains(fromJSON('["parser", "transform", "minify"]'), inputs.name)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgo-corpus
          path: target/pgo/corpus

      - name: Build and validate PGO binding
        if: matrix.pgo && contains(fromJSON('["parser", "transform", "minify"]'), inputs.name)
        run: |
          rustup component add llvm-tools-preview
          pnpm node tasks/pgo/pgo.mjs "$name" --target ${{ matrix.target }} --corpus target/pgo/corpus
        env:
          TARGET_CC: ${{ !contains(matrix.target, 'pc-windows-msvc') && 'clang' || '' }}

      - name: Upload PGO provenance
        if: matrix.pgo && contains(fromJSON('["parser", "transform", "minify"]'), inputs.name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgo-${{ inputs.name }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/pgo/${{ inputs.name }}/${{ matrix.target }}/merged.profdata
            target/pgo/${{ inputs.name }}/${{ matrix.target }}/profile.json

      - name: Upload installable PGO package
        if: matrix.pgo && contains(fromJSON('["parser", "transform", "minify"]'), inputs.name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: napi-pgo-${{ inputs.name }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: target/pgo/${{ inputs.name }}/${{ matrix.target }}/npm

      - name: Build
        if: ${{ !matrix.pgo || !contains(fromJSON('["parser", "transform", "minify"]'), inputs.name) }}
        working-directory: napi/${{ inputs.name }}
        run: ${{ matrix.build }}
        shell: bash
        env:
          # `clang` lacks the `__ldar64`/`__stlr64` MSVC intrinsics that mimalloc's
          # atomic.h uses on the ARM64 MSVC C path, so leave TARGET_CC unset on
          # `*-pc-windows-msvc` targets and let cc-rs pick `cl.exe`.
          TARGET_CC: ${{ !contains(matrix.target, 'pc-windows-msvc') && 'clang' || '' }} # for mimalloc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: bindings-${{ matrix.target }}
          # `**/*.node` because in `napi/parser`, binaries are in `src-js` subdirectory
          path: |
            napi/${{ inputs.name }}/**/*.node
            napi/${{ inputs.name }}/**/*.wasm

  build-freebsd:
    needs: check
    if: needs.check.outputs.version_changed == 'true'
    name: Build FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - run: rustup target add x86_64-unknown-freebsd
          - name: Install Zig
            uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
            with:
              version: "0.15.2"
          - name: Install cargo-zigbuild
            uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
            with:
              repo: rust-cross/cargo-zigbuild

      - name: Build
        working-directory: napi/${{ inputs.name }}
        run: pnpm build --target x86_64-unknown-freebsd -x

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: bindings-freebsd
          # `**/*.node` because in `napi/parser`, binary is in `src-js` subdirectory
          path: napi/${{ inputs.name }}/**/*.node

  publish:
    name: Publish NAPI
    needs:
      - build
      - build-freebsd
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for `pnpm publish --provenance`
    env:
      name: ${{ inputs.name }}
      package_path: napi/${{ inputs.name }}
      npm_dir: release-dir
      PUBLISH_FLAGS: "--provenance --access public --no-git-checks"
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - parallel:
          - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
              pattern: bindings-*
              path: artifacts

      - run: mkdir -p ${npm_dir}

      - run: pnpm napi create-npm-dirs --package-json-path ${package_path}/package.json --npm-dir ${npm_dir}

      - run: pnpm napi artifacts --package-json-path ${package_path}/package.json --build-output-dir ${package_path}/src-js --npm-dir ${npm_dir}
        if: ${{ inputs.name == 'parser' }}

      - run: pnpm napi artifacts --package-json-path ${package_path}/package.json --build-output-dir ${package_path} --npm-dir ${npm_dir}
        if: ${{ inputs.name != 'parser' }}

      - run: pnpm -C ${package_path} build-browser-bundle --npmDir ../../${npm_dir}
        if: ${{ inputs.name == 'parser' }}

      - name: Check Publish
        run: node .github/scripts/check-npm-packages.js "${npm_dir}/*" "${package_path}"

      - name: Prepare release packages without publishing
        if: github.event_name == 'workflow_dispatch' || inputs.dry-run
        run: |
          pnpm napi pre-publish --no-gh-release --skip-optional-publish -t npm --package-json-path ${package_path}/package.json --npm-dir ${npm_dir}
          mkdir -p package-artifacts
          for package in ${npm_dir}/* ${package_path}; do
            pnpm --dir "$package" pack --pack-destination "$GITHUB_WORKSPACE/package-artifacts"
          done

      - name: Upload release packages
        if: github.event_name == 'workflow_dispatch' || inputs.dry-run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.name }}
          if-no-files-found: error
          compression-level: 0
          path: package-artifacts/*.tgz

      - name: Trusted Publish
        if: github.event_name != 'workflow_dispatch' && !inputs.dry-run
        run: |
          # Trusted publishing is configured, publish token is not required.
          # Publish sub-packages and adds `optionalDependencies` to `package_path`.
          pnpm napi pre-publish --no-gh-release -t npm --package-json-path ${package_path}/package.json --npm-dir ${npm_dir}
          # npm publish can finish before package metadata and tarballs are available.
          node .github/scripts/wait-for-npm-packages.mjs ${npm_dir}/*
          bash .github/scripts/publish-if-needed.sh ${package_path} ${PUBLISH_FLAGS}
