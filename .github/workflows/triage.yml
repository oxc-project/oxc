# Automatically investigates bug reports and can open a pull request with a verified fix.
# Repository setup required before this job will run:
#   - Install the oxc-captain GitHub App on this repository with Contents, Issues,
#     and Pull requests write access.
#   - CAPTAIN_ID: the oxc-captain GitHub App's client ID, as a repository secret.
#   - CAPTAIN_KEY: the oxc-captain GitHub App's private key.
#   - CLOUDFLARE_API_KEY: an inference token with access to the selected models.
#   - CLOUDFLARE_ACCOUNT_ID: the Cloudflare account ID.
#   - GLM-5.3 uses Workers Paid billing or prepaid AI Gateway credits.

name: Issue Triage

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - .cargo/**
      - rust-toolchain.toml
      - .github/workflows/triage.yml
  pull_request:
    paths:
      - .github/workflows/triage.yml
  # Recover from cache eviction and changes to the hosted runner's Rust toolchains.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions: {}

env:
  INSTA_REQUIRE_FULL_MATCH: 1

jobs:
  warm-cache:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: triage-rust-cache-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-key: warm
          tools: just,cargo-shear@1.13.1,cargo-insta,ast-grep
          components: clippy rustfmt

      # Match the common reproduction and test commands, keeping their feature sets separate.
      - name: Warm oxlint dependencies
        run: cargo build --locked -p oxlint

      - name: Warm linter test dependencies
        run: cargo test --locked --no-run -p oxc_linter

  triage:
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      !github.event.issue.pull_request &&
      (github.event.action != 'created' ||
       (github.event.comment.user.login != 'github-actions[bot]' &&
        github.event.comment.user.login != 'oxc-captain[bot]'))
    runs-on: ubuntu-latest
    # GitHub App installation tokens expire after one hour.
    timeout-minutes: 55
    permissions:
      contents: read
      issues: read
    concurrency:
      # Bot comments can enqueue another event before the issue's label is updated.
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: oxc-project/setup-node@f46a72f95efdc55273fcd042d61c84e723b2892c # v1.4.1

      - name: Set up Rust
        # Only the trusted warm-cache job saves this dependency cache.
        uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
        with:
          save-cache: false
          cache-key: warm
          tools: just,cargo-shear@1.13.1,cargo-insta,ast-grep
          components: clippy rustfmt

      - name: Create oxc-captain token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.CAPTAIN_ID }}
          private-key: ${{ secrets.CAPTAIN_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Configure Git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_user_id="$(gh api 'users/oxc-captain[bot]' --jq .id)"
          git config user.name "oxc-captain[bot]"
          git config user.email "${bot_user_id}+oxc-captain[bot]@users.noreply.github.com"

      # The pinned action expects its state labels plus at least one "- P" label,
      # but does not create them itself.
      - name: Create missing triage labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/setup-triagebot-labels.sh

      - name: Triage the issue
        # The Oxc fork accepts new catalog models without a bundled registry update.
        uses: oxc-project/triagebot-action@193fffc8fe10143c63a82f53c004858d7707ec10
        with:
          read-token: ${{ github.token }}
          write-token: ${{ steps.app-token.outputs.token }}
          cloudflare-api-key: ${{ secrets.CLOUDFLARE_API_KEY }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          triage-model: cloudflare-ai/@cf/zai-org/glm-5.3
          verification-model: cloudflare-ai/@cf/zai-org/glm-5.3
          triage-skill: .agents/skills/triage
          pr-skill: .agents/skills/triage-bot-pr-writer
          # The action invokes the PR skill by frontmatter name, which defaults to `pr-writer`.
          pr-skill-name: triage-bot-pr-writer
          # Leave assigned issues with their assignees; only auto-open PRs for unassigned issues.
          auto-pr-on-fix: ${{ !github.event.issue.assignees[0] }}
          bot-logins: oxc-captain[bot]
          # Pick area labels from the existing `A-*` labels.
          label-package-prefix: "A-"
          # Reuse the issue state label on bot PRs instead of a separate `fix verified` label.
          pr-label-fix-verified: "triage: fix verified"
