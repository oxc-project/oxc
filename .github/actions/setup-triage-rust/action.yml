name: Set up triage Rust
description: Use the same Rust environment and dependency cache for triage and its cache warmer.

inputs:
  save-cache:
    description: Allow trusted default-branch runs to save the dependency cache.
    default: "false"

outputs:
  cache-hit:
    description: Whether the dependency cache matched exactly.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
      with:
        restore-cache: false
        tools: just,cargo-shear@1.13.1,cargo-insta,ast-grep
        components: clippy rustfmt

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      id: cache
      with:
        # Bump the version when changing the warm-up commands or build profiles.
        shared-key: triage-v1
        # Keep compiled dependencies; fresh checkouts rebuild workspace crates.
        cache-workspace-crates: false
        # setup-rust installs these tools separately.
        cache-bin: false
        save-if: >-
          ${{ inputs.save-cache == 'true' &&
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'schedule' ||
               github.event_name == 'workflow_dispatch') }}
