[package]
name = "website_formatter"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "website_formatter"
doctest = false

[dependencies]
oxfmt = { workspace = true }
pico-args = { workspace = true }
# indexmap2 / preserve_order: emit schema properties in declaration order.
# Also keeps the standalone `just formatter-schema-json` build consistent with
# CI's workspace-wide build, where feature unification enables them via `oxc_linter`.
schemars = { workspace = true, features = ["indexmap2"] }
serde_json = { workspace = true, features = ["preserve_order"] }
website_common = { workspace = true }
usage-parser = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
project-root = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["serde_json"]
