packages:
  - apps/*
  - napi/*
  - packages/*
  - wasm/*
  - npm/*
  - tasks/codegen_conformance
  - tasks/e2e
  - tasks/transform_conformance
  - tasks/compat_data

catalog:
  "@emnapi/core": 2.0.0-alpha.6
  "@emnapi/runtime": 2.0.0-alpha.6
  emnapi: 2.0.0-alpha.6
  "@arethetypeswrong/core": 0.18.5
  "@napi-rs/cli": 3.10.8
  "@napi-rs/wasm-runtime": 1.2.5
  "@types/node": 24.1.0
  cross-env: ^10.1.0
  degit: 3.10.0
  eslint: 10.12.0
  json-schema-to-typescript: ^16.0.0
  publint: 0.3.25
  rolldown: 1.2.14
  tsdown: 0.23.1
  vite: 8.3.4
  vite-plus: 1.3.0
  vitest: 5.0.3

overrides:
  rolldown: "catalog:"
  vite: "catalog:"
  emnapi: "catalog:"

allowBuilds:
  "@vscode/vsce-sign@2.0.8": true
  esbuild@0.27.7: true
  esbuild@0.28.2: true
  "@nestjs/core@11.1.9": false

verifyDepsBeforeRun: install
minimumReleaseAgeExclude:
  - "@napi-rs/*"
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "@rolldown/*"
  - "@tsdown/*"
  - "@vitejs/devtools"
  - "@vitest/*"
  - "@voidzero-dev/*"
  - oxc-parser
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - rolldown
  - tsdown
  - vite
  - vite-plus
  - vitest
