[package]
name = "oxc_linter_core"
version = "1.90.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/src"]
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Shared infrastructure for Oxc lint rules."

[features]
default = []
ruledocs = []

[lints]
workspace = true

[dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_cfg = { workspace = true }
oxc_codegen = { workspace = true, default-features = false }
oxc_diagnostics = { workspace = true }
oxc_parser = { workspace = true }
oxc_react_compiler = { workspace = true }
oxc_semantic = { workspace = true, features = ["cfg", "linter"] }
oxc_span = { workspace = true, features = ["schemars", "serialize"] }
oxc_str = { workspace = true, features = ["serialize"] }
oxc_syntax = { workspace = true }

bitflags = { workspace = true }
cow-utils = { workspace = true }
itertools = { workspace = true }
javascript-globals = { workspace = true }
lazy-regex = { workspace = true }
rust-lapper = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true, features = ["indexmap2", "regex"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
