[package]
name = "oxc_linter_rules_react_perf"
version = "1.90.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/src"]
keywords.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "React performance lint rules for Oxc."

[features]
default = []
ruledocs = ["oxc_linter_core/ruledocs", "oxc_macros/ruledocs"]

[lints]
workspace = true

[dependencies]
oxc_ast = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_linter_core = { workspace = true }
oxc_macros = { workspace = true, features = ["ruledocs"] }
oxc_semantic = { workspace = true, features = ["cfg", "linter"] }
oxc_span = { workspace = true }
oxc_str = { workspace = true, features = ["serialize"] }
oxc_syntax = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
oxc_linter = { workspace = true, features = ["tester"] }

[lib]
doctest = false

