[package]
name = "oxc_lexer"
version = "0.158.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include = ["/src"]
keywords.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
oxc_ast = { workspace = true }
oxc_data_structures = { workspace = true, features = ["assert_unchecked", "branch_hints", "str"] }
oxc_simd = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
constcat = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }

oxc_diagnostics = { workspace = true, optional = true }

[features]
oxc_diagnostics = ["dep:oxc_diagnostics"]
# Expose `oxc_lexer::testing` module, for conformance tests
testing = ["oxc_simd/testing"]

[dev-dependencies]
# The integration tests use `oxc_lexer::testing`
oxc_lexer = { workspace = true, features = ["testing"] }
# The tests use `oxc_simd`'s testing helpers, e.g. `#[test_cpus]`
oxc_simd = { workspace = true, features = ["testing"] }
